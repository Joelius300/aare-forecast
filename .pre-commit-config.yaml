repos:
  - repo: local
    hooks:
      - id: update-hooks
        language: system
        name: update-hooks
        entry: prek auto-update --cooldown-days 1
        always_run: true
        pass_filenames: false
        priority: 0
        fail_fast: true
        # -   id: pyright-local
        # language: system
        # name: pyright-local
        # entry: uv run basedpyright
        # types_or: [python, pyi, jupyter]
        # pass_filenames: false
      - id: ruff-check-local
        language: system
        name: ruff-check-local
        entry: uv run ruff check --force-exclude --fix
        types_or: [python, pyi, jupyter]
        pass_filenames: true
        require_serial: true
        priority: 1
      - id: ruff-format-local
        language: system
        name: ruff-format-local
        entry: uv run ruff format --force-exclude
        types_or: [python, pyi, jupyter]
        pass_filenames: true
        require_serial: true
        priority: 2
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.1
    hooks:
      - id: uv-lock
        priority: 1
  - repo: https://github.com/iterative/dvc
    rev: 3.67.0
    hooks:
      - id: dvc-pre-commit
        priority: 1
