stages:
  fit-scaler:
    cmd: python scripts/fit_scaler.py
    params:
      - split.train_split
      - split.val_split
    outs:
      - data/scaler.pkl
  establish-baselines:
    cmd: python scripts/establish_baselines.py
    params:
      - general.forecast_horizon
      - split.val_split
      - split.test_split
      - validation.stride
      - validation.min_lookback_hours
    outs:
      - data/forecast_samples/LOCF.pkl
      - data/forecast_samples/SNAIVE.pkl
      - data/forecast_samples/MEAN.pkl
    metrics:
      - data/metrics/LOCF.json
      - data/metrics/SNAIVE.json
      - data/metrics/MEAN.json
  timesfm-baseline:
    cmd: uv run --no-project --python 3.11 scripts/timesfm_baseline.py
    params:
      - general.forecast_horizon
      - split.val_split
      - split.test_split
      - validation.stride
      - validation.min_lookback_hours
    outs:
      - data/forecast_samples/TIMESFM.pkl
    metrics:
      - data/metrics/TIMESFM.json
