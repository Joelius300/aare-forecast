# values from EDA
general:
  frequency: 1h  # this is used everywhere and integrated so tightly, that it cannot simply be changed
  forecast_horizon: 96
  timezone: "Europe/Zurich"
features:
  temp_bern:  # water temperature [°C]
    outliers:
      low_cutoff: 2.5
      high_cutoff: 25
      diff_threshold: 0.6  # 0.995 quantile
    interpolate:
      # depending on how good imputation is,
      # could lower these a bit.
      # They work often, but sometimes fail badly.
      linear_gap_bound: 3
      cubic_gap_bound: 25
  flow:  # flow [m3/s]
    outliers:
      low_cutoff: 30
      high_cutoff: 99999
      diff_threshold: 14.5
    interpolate:
      linear_gap_bound: 3
      cubic_gap_bound: 23
  tt:  # air temperature [°C]
    interpolate:
      linear_gap_bound: 3
      cubic_gap_bound: 25
  ss:  # sunshine duration (minutes)
    outliers:
      low_cutoff: 0
      high_cutoff: 60
    interpolate:
      median_gap_bound: 10
  rr:  # total rainfall (mm)
    outliers:
      low_cutoff: 0
      high_cutoff: 99999
    interpolate:
      median_gap_bound: 10
  rh:  # relative humidity (%)
    outliers:
      low_cutoff: 0
      high_cutoff: 100
    interpolate:
      linear_gap_bound: 3
      cubic_gap_bound: 10
split:
  # 12 years in total (2013-2025)
  train_split: "2013-09-01"
  # 8 years training
  val_split: "2021-09-01"
  # 2 years validation; summer is harder to predict (higher variance), val should not be winter-biased
  test_split: "2023-09-01"
  # 1.6+ years test -> expected to eval at ~2y
validation:
  stride: 24  # one eval per day, anything coprime with 24 will make sure all hours are used as starts equally
  # how many previous hours should AT LEAST be included when storing forecasts. will take INPUT_CHUNK_SIZE if bigger.
  min_lookback_hours: 24
timesfm:
  version: 200m  # although 500m results in lower STD, the overall MAE is higher than 200m