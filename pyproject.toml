[project]
name = "aare-forecast"
version = "0.1.0"
description = "Forecasting temperature (and water level) for the Swiss river Aare"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "darts>=0.32.0",
    "influxdb-client>=1.48.0",
    "matplotlib>=3.10.0",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
    "polars>=1.18.0",
    "statsmodels>=0.14.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "jupyter>=1.1.1",
    "jupyterlab>=4.3.4",
]
