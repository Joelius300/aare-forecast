[project]
name = "aare-forecast"
version = "0.1.0"
description = "Forecasting temperature (and water level) for the Swiss river Aare"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
package = false

[dependency-groups]
dev = [
    "aare-shared",
    "gunicorn>=23.0.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "jupyter>=1.1.1",
    "jupyterlab>=4.3.4",
    "mlflow>=2.22.0",
    "nbstripout>=0.8.1",
    "optuna>=4.3.0",
    "optuna-dashboard>=0.18.0",
    "optuna-fast-fanova>=0.0.4",
    "plotly>=6.1.2",
    "psutil>=7.0.0",
    "psycopg[binary,pool]>=3.2.9",
    "pynvml>=12.0.0",
    "pypots>=0.19",
    "pyright>=1.1.391",
    "requests>=2.32.3",
    "ruff>=0.9.5",
    "statsmodels>=0.14.4",
]

[tool.pyright]
reportRedeclaration = "warning"

[tool.uv.workspace]
members = [
    "src/aare-shared",
    "src/prediction-service",
]

[tool.uv.sources]
aare-shared = { workspace = true }
