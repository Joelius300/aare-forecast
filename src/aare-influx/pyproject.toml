[project]
name = "aare-influx"
version = "0.1.0"
description = "Library to communicate with remote existenz influx data store"
requires-python = ">=3.11"
dependencies = [
    "aare",
    "pandas>=2.3.2",
    "influxdb-client>=1.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aare_influx"]

[tool.uv.sources]
aare = { workspace = true }
