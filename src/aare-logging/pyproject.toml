[project]
name = "aare-logging"
version = "0.1.0"
description = "Logging for aare-oraku"
requires-python = ">=3.11"
dependencies = ["python-logging-loki-v2>=1.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aare_logging"]
