[project]
name = "aare-timescale"
version = "0.1.0"
description = "TimescaleDB functionality for aare-oraku"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2.9",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aare_timescale"]
