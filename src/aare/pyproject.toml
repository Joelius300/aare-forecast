[project]
name = "aare"
version = "0.1.0"
description = "Core code in lightweight package for all use cases (train, inference, api, etc.)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# needed to sync with --no-install-project where sources cannot be explored, despite this being (one of) the default(s)
[tool.hatch.build.targets.wheel]
packages = ["src/aare"]
