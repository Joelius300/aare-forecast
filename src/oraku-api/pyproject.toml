[project]
name = "aare-oraku-api"
version = "0.3.5"
description = "API to get data from the forecast database"
requires-python = ">=3.12"
dependencies = [
    "aare",
    "aare-logging",
    "aare-timescale",
    "fastapi>=0.116.1",
    "pandas>=2.3.2",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "uvicorn[standard]>=0.36.0",
]

[dependency-groups]
dev = ["fastapi-cli[standard-no-fastapi-cloud-cli]>=0.0.13"]

[tool.uv.sources]
aare = { workspace = true }
aare-logging = { workspace = true }
aare-timescale = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oraku_api"]
