[project]
name = "aare-oraku-influx2pg"
version = "0.1.0"
description = "Service to mirror data from the existenz InfluxDB into our PostgreSQL/TimescaleDB"
requires-python = ">=3.12"
dependencies = [
    "aare",
    "aare-logging",
    "aare-timescale",
    "aare-influx",
    "configargparse>=1.7.1",
    "uvloop>=0.21.0",
]

[tool.uv.sources]
aare = { workspace = true }
aare-logging = { workspace = true }
aare-timescale = { workspace = true }
aare-influx = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oraku_influx2pg"]
