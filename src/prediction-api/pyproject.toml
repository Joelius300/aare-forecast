[project]
name = "aare-oraku-prediction-api"
version = "0.1.0"
description = "API to get data from the prediction database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "psycopg[binary,pool]>=3.2.10",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "uvicorn[standard]>=0.36.0",
]

[dependency-groups]
dev = [
    "fastapi-cli[standard-no-fastapi-cloud-cli]>=0.0.13",
]
